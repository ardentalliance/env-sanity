name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          
          GOOS=linux GOARCH=amd64 go build -o dist/env-sanity-linux-amd64 ./cmd/env-sanity
          GOOS=linux GOARCH=arm64 go build -o dist/env-sanity-linux-arm64 ./cmd/env-sanity
          GOOS=darwin GOARCH=amd64 go build -o dist/env-sanity-macos-amd64 ./cmd/env-sanity
          GOOS=darwin GOARCH=arm64 go build -o dist/env-sanity-macos-arm64 ./cmd/env-sanity
          GOOS=windows GOARCH=amd64 go build -o dist/env-sanity-windows-amd64.exe ./cmd/env-sanity

      - name: Create checksums
        run: |
          cd dist
          shasum -a 256 * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/env-sanity-linux-amd64
            dist/env-sanity-linux-arm64
            dist/env-sanity-macos-amd64
            dist/env-sanity-macos-arm64
            dist/env-sanity-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
